[package]
name = "fractalnaute-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
dashu-float = "0.4"

[package.metadata.wasm-pack.profile.release]
# Bundled wasm-opt lacks bulk-memory support; skip it.
# Rust compiler already optimizes with opt-level = "z".
wasm-opt = false

# [profile.release] is in workspace root Cargo.toml
